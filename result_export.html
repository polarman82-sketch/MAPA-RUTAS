<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resultado - Recorrido de Vehículo</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .header {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.18);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        .title {
            font-weight: 700;
            font-size: 14px;
            margin: 0 0 6px 0;
        }

        .meta {
            font-size: 12px;
            color: #333;
            line-height: 1.35;
        }

        .meta strong {
            font-weight: 650;
        }

        .day-nav {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 8px 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.22);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            user-select: none;
        }

        .day-nav button {
            border: none;
            background: #0d6efd;
            color: white;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .day-nav button:hover { background: #0b5ed7; }
        .day-nav button:disabled { background: #adb5bd; cursor: default; }

        .day-nav .day-label {
            font-weight: 600;
            font-size: 0.95rem;
            min-width: 130px;
            text-align: center;
        }

        .day-nav .day-counter {
            font-size: 0.8rem;
            color: #666;
        }

        .day-nav .btn-all {
            background: #6c757d;
            font-size: 0.78rem;
            width: auto;
            padding: 0 10px;
        }

        .day-nav .btn-all:hover { background: #5a6268; }
        .day-nav .btn-all.active { background: #0d6efd; }
    </style>
</head>
<body>
<div id="map"></div>

<div class="header">
    <div class="title">Recorrido de Vehículo</div>
    {% if summary %}
        <div class="meta">
            <div><strong>Archivo:</strong> {{ summary.filename }}</div>
            <div><strong>Puntos:</strong> {{ summary.total_points }} | <strong>Paradas:</strong> {{ summary.total_stops }} | <strong>Distancia:</strong> {{ summary.total_distance_km }} km</div>
            <div><strong>Inicio:</strong> {{ summary.start_time }} | <strong>Fin:</strong> {{ summary.end_time }}</div>
        </div>
    {% endif %}
</div>

<div id="dayNav" class="day-nav" style="display:none;">
    <button id="btnAllDays" class="btn-all active" title="Todos los dias">Todo</button>
    <button id="btnPrevDay" title="Dia anterior">&#9664;</button>
    <div>
        <div class="day-label" id="dayLabel">--</div>
        <div class="day-counter" id="dayCounter"></div>
    </div>
    <button id="btnNextDay" title="Dia siguiente">&#9654;</button>
</div>

<script>
    const routePoints = {{ route_points|tojson }};
    const stopItems = {{ stops|tojson }};

    const map = L.map("map").setView([40.4168, -3.7038], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors",
        maxZoom: 19
    }).addTo(map);

    function makeIcon(color) {
        return L.divIcon({
            className: "",
            html: `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:2px solid white;box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });
    }
    const startIcon = makeIcon("#198754");
    const endIcon   = makeIcon("#dc3545");

    function uniqueDates(points) {
        const seen = new Set();
        const dates = [];
        points.forEach(p => {
            if (p.date && !seen.has(p.date)) { seen.add(p.date); dates.push(p.date); }
        });
        return dates;
    }

    const allDates = uniqueDates(routePoints);
    const multiDay = allDates.length > 1;

    function buildDayLayer(pts, stps) {
        const group = L.layerGroup();
        if (pts.length === 0) return { group, bounds: [] };

        const latlngs = pts.map(p => [p.lat, p.lon]);
        L.polyline(latlngs, { color: "#0d6efd", weight: 4, opacity: 0.85 }).addTo(group);

        const first = pts[0];
        const last  = pts[pts.length - 1];

        L.marker([first.lat, first.lon], { icon: startIcon }).addTo(group)
            .bindPopup(`<strong>Inicio</strong><br>${first.fecha_hora}<br>${first.lat}, ${first.lon}`);
        L.marker([last.lat, last.lon], { icon: endIcon }).addTo(group)
            .bindPopup(`<strong>Fin</strong><br>${last.fecha_hora}<br>${last.lat}, ${last.lon}`);

        pts.forEach((p, i) => {
            if (i !== 0 && i !== pts.length - 1) {
                L.circleMarker([p.lat, p.lon], {
                    radius: 3, color: "#6c757d", fillColor: "#6c757d", fillOpacity: 0.7, weight: 0
                }).addTo(group).bindPopup(`<strong>Punto</strong><br>${p.fecha_hora}<br>${p.lat}, ${p.lon}`);
            }
        });

        stps.forEach((s, idx) => {
            const isLong = s.type === "long";
            const color  = isLong ? "#e53e3e" : "#fd7e14";
            const label  = isLong ? "Parada larga duraci\u00f3n" : "Parada";
            if (isLong) {
                const triIcon = L.divIcon({
                    className: "",
                    html: `<svg width="22" height="22" viewBox="0 0 22 22"><polygon points="11,2 2,20 20,20" fill="${color}" stroke="white" stroke-width="2"/></svg>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 18]
                });
                L.marker([s.lat, s.lon], { icon: triIcon }).addTo(group).bindPopup(
                    `<strong>${label}</strong><br>Inicio: ${s.start}<br>Fin: ${s.end}<br>` +
                    `Duraci\u00f3n: ${s.duration_min} min<br>Puntos: ${s.points}<br>Coord: ${s.lat}, ${s.lon}`
                );
            } else {
                L.circleMarker([s.lat, s.lon], {
                    radius: 8, color: color, fillColor: color, fillOpacity: 0.95, weight: 1
                }).addTo(group).bindPopup(
                    `<strong>${label}</strong><br>Inicio: ${s.start}<br>Fin: ${s.end}<br>` +
                    `Duraci\u00f3n: ${s.duration_min} min<br>Puntos: ${s.points}<br>Coord: ${s.lat}, ${s.lon}`
                );
            }
        });

        const allBounds = latlngs.concat(stps.map(s => [s.lat, s.lon]));
        return { group, bounds: allBounds };
    }

    const allLayer = buildDayLayer(routePoints, stopItems);
    allLayer.group.addTo(map);
    if (allLayer.bounds.length > 0) map.fitBounds(allLayer.bounds, { padding: [30, 30] });

    const dayLayers = {};
    allDates.forEach(date => {
        const pts  = routePoints.filter(p => p.date === date);
        const stps = stopItems.filter(s => s.date === date);
        dayLayers[date] = buildDayLayer(pts, stps);
    });

    let currentDayIndex = -1;

    const dayNav     = document.getElementById("dayNav");
    const dayLabel   = document.getElementById("dayLabel");
    const dayCounter = document.getElementById("dayCounter");
    const btnPrev    = document.getElementById("btnPrevDay");
    const btnNext    = document.getElementById("btnNextDay");
    const btnAll     = document.getElementById("btnAllDays");

    function showDay(index) {
        map.eachLayer(layer => {
            if (layer instanceof L.TileLayer) return;
            map.removeLayer(layer);
        });

        currentDayIndex = index;

        if (index === -1) {
            allLayer.group.addTo(map);
            if (allLayer.bounds.length > 0) map.fitBounds(allLayer.bounds, { padding: [30, 30] });
            dayLabel.textContent = "Todos los dias";
            dayCounter.textContent = `${allDates.length} dias`;
            btnAll.classList.add("active");
            btnPrev.disabled = false;
            btnNext.disabled = false;
        } else {
            const date = allDates[index];
            const dl = dayLayers[date];
            dl.group.addTo(map);
            if (dl.bounds.length > 0) map.fitBounds(dl.bounds, { padding: [30, 30] });
            dayLabel.textContent = date;
            dayCounter.textContent = `Dia ${index + 1} de ${allDates.length}`;
            btnAll.classList.remove("active");
            btnPrev.disabled = (index === 0);
            btnNext.disabled = (index === allDates.length - 1);
        }
    }

    if (multiDay && dayNav) {
        dayNav.style.display = "flex";
        btnPrev.addEventListener("click", () => {
            if (currentDayIndex === -1) showDay(allDates.length - 1);
            else if (currentDayIndex > 0) showDay(currentDayIndex - 1);
        });
        btnNext.addEventListener("click", () => {
            if (currentDayIndex === -1) showDay(0);
            else if (currentDayIndex < allDates.length - 1) showDay(currentDayIndex + 1);
        });
        btnAll.addEventListener("click", () => showDay(-1));
        showDay(-1);
    }
</script>
</body>
</html>
